# ==============================================================================
# FreshRoute — pytest configuration
# ==============================================================================
#
# Run all tests:
#     pytest
#
# Run with verbose output:
#     pytest -v
#
# Run with coverage:
#     pytest --cov=app --cov-report=term-missing
#
# Run a specific test class:
#     pytest tests/test_scheduling.py::TestSchedulingEngineSpec -v
# ==============================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short tracebacks for cleaner output
addopts = -ra -q

asyncio_mode = auto

# Treat warnings as errors to keep the codebase clean
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
